[project]
name = "portafolio-evals"
version = "0.1.0"
description = "Evals de los textos del portafolio: patrones de IA (código) y dos jueces con Claude vía Vertex AI."
requires-python = ">=3.11,<3.13"
dependencies = [
  "fundamentum-adk[claude]==1.7.0",
  "fundamentum-modelos==1.7.0",
  "pydantic>=2.9",
  "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
evals = "portafolio_evals.correr:main"

[tool.uv]
package = true

[tool.uv.sources]
fundamentum-adk = { git = "https://github.com/Metuendus/fundamentum", tag = "v1.7.0", subdirectory = "python/fundamentum_adk" }
fundamentum-modelos = { git = "https://github.com/Metuendus/fundamentum", tag = "v1.7.0", subdirectory = "python/fundamentum_modelos" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["portafolio_evals"]
