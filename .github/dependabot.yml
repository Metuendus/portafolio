# Actualizaciones semanales. Las menores y parches llegan juntas en un solo PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, timezone: America/Mexico_City }
    open-pull-requests-limit: 5
    # @astrojs/check solo acepta typescript ^5 || ^6; quitar cuando soporte la 7.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      menores: { update-types: [minor, patch] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, timezone: America/Mexico_City }
    groups:
      acciones: { patterns: ["*"] }
