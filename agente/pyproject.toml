[project]
name = "agente-encaje"
version = "0.1.0"
description = "Graba corridas reales de un agente que evalúa el encaje de José Carlos con una vacante."
requires-python = ">=3.11,<3.13"
dependencies = [
  "fundamentum-adk==1.5.0",
  "fundamentum-modelos==1.5.0",
  "pydantic>=2.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = true

[tool.uv.sources]
fundamentum-adk = { git = "https://github.com/Metuendus/fundamentum", tag = "v1.5.0", subdirectory = "python/fundamentum_adk" }
fundamentum-modelos = { git = "https://github.com/Metuendus/fundamentum", tag = "v1.5.0", subdirectory = "python/fundamentum_modelos" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agente_encaje"]
